services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${DOCKER_IMAGE_NAME:-sbn-cat}:${DOCKER_IMAGE_TAG:-local}"
    environment:
      DOCKER_IMAGE_TAG: "${DOCKER_IMAGE_TAG:-local}"
      AWS_REGION: "${AWS_REGION:-${TF_VAR_AWS_REGION:-us-east-1}}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-${AWS_REGION:-${TF_VAR_AWS_REGION:-us-east-1}}}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      TF_VAR_AWS_ACCESS_KEY_ID: "${TF_VAR_AWS_ACCESS_KEY_ID:-}"
      TF_VAR_AWS_SECRET_ACCESS_KEY: "${TF_VAR_AWS_SECRET_ACCESS_KEY:-}"
      TF_VAR_AWS_SESSION_TOKEN: "${TF_VAR_AWS_SESSION_TOKEN:-}"
      CAT_IMAGES_BUCKET: "${CAT_IMAGES_BUCKET:-}"
      CAT_IMAGES_PREFIX: "${CAT_IMAGES_PREFIX:-generated-images/}"
      CAT_IMAGES_BASE_URL: "${CAT_IMAGES_BASE_URL:-}"
      TF_VAR_CAT_IMAGES_BUCKET_NAME: "${TF_VAR_CAT_IMAGES_BUCKET_NAME:-}"
      TF_VAR_S3_BUCKET_NAME: "${TF_VAR_S3_BUCKET_NAME:-}"
      CAT_CACHE_BUCKET: "${CAT_CACHE_BUCKET:-${TF_VAR_CAT_CACHE_BUCKET_NAME:-${TF_VAR_PROJECT_PREFIX:-sbn-cat-}cache}}"
      CAT_CACHE_PREFIX: "${CAT_CACHE_PREFIX:-cache/}"
      TF_VAR_CAT_CACHE_BUCKET_NAME: "${TF_VAR_CAT_CACHE_BUCKET_NAME:-}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${HOME}/.astrometry/data:/root/.astrometry/data"
